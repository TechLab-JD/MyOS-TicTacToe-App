<div class="app-window" id="TicTacToeApp">
  <div class="app-header"><span class="app-title">⭕ Tic-Tac-Toe</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="tt">
      <div id="tt-status" class="tt-status">Your turn (X)</div>
      <div id="tt-board" class="tt-board"></div>
      <button id="tt-new" class="tt-new">New game</button>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
